services:
  db:
    image: mysql:8.4
    container_name: appbit-db
    restart: unless-stopped
    env_file:
      - .env.docker
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - appbit_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  appbit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appbit
    restart: unless-stopped
    init: true
    env_file:
      - .env.docker
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - appbit_backups:/app/backups
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login',{redirect:'manual'}).then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  appbit_mysql_data:
  appbit_backups:
